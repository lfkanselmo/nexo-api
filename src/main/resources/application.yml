spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: nexo-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:nexo}
    username: ${DB_USER:nexo}
    password: ${DB_PASSWORD:nexo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

nexo:
  mail:
    reminder-from: ${REMINDER_FROM_EMAIL:no-reply@nexo.local}
  scheduler:
    overdue-cron: ${OVERDUE_CRON:0 0 6 * * *}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
